[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entryconf"
version = "0.4.0rc1"
description = "Python implementation of the entryconf spec 0.4.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
watch = ["watchdog>=4"]
test = ["pytest>=7", "watchdog>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
